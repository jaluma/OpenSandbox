name: Publish All Images and Chart

on:
  push:
    tags:
      - 'release/v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  build-image:
    name: Build and push ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            version: v0.2.2
            dockerfile: server/Dockerfile
            context: server
          - component: execd
            version: v1.0.21
            dockerfile: components/execd/Dockerfile
            context: .
          - component: ingress
            version: v1.0.10
            dockerfile: components/ingress/Dockerfile
            context: .
          - component: egress
            version: v1.1.5
            dockerfile: components/egress/Dockerfile
            context: .
          - component: controller
            version: v0.2.0
            dockerfile: kubernetes/Dockerfile
            context: kubernetes
            build_args: PACKAGE=./cmd/controller
          - component: task-executor
            version: v0.2.0
            dockerfile: kubernetes/Dockerfile
            context: kubernetes
            build_args: "PACKAGE=cmd/task-executor/main.go\nUSERID=0"
          - component: image-committer
            version: v0.1.1
            dockerfile: kubernetes/Dockerfile.image-committer
            context: kubernetes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/opensandbox/${{ matrix.component }}:${{ matrix.version }}
          build-args: ${{ matrix.build_args }}

  publish-chart:
    name: Publish Helm chart
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Update chart image references to GHCR
        env:
          GHCR_REPO: ghcr.io/${{ github.repository_owner }}/opensandbox
        run: |
          CONTROLLER_VALUES="kubernetes/charts/opensandbox-controller/values.yaml"
          SERVER_VALUES="kubernetes/charts/opensandbox-server/values.yaml"

          sed -i "s|repository: .*opensandbox/controller|repository: ${GHCR_REPO}/controller|" "$CONTROLLER_VALUES"
          sed -i "s|imageCommitterImage: .*|imageCommitterImage: \"${GHCR_REPO}/image-committer:v0.1.1\"|" "$CONTROLLER_VALUES"

          sed -i "s|repository: .*opensandbox/server|repository: ${GHCR_REPO}/server|" "$SERVER_VALUES"
          sed -i "s|tag: \"v0\.2\.[0-9]*\"\( *\)$|tag: \"v0.2.2\"|" "$SERVER_VALUES"
          sed -i "s|repository: .*opensandbox/ingress|repository: ${GHCR_REPO}/ingress|" "$SERVER_VALUES"
          sed -i "s|tag: \"v1\.0\.[0-9]*\"\( *\)$|tag: \"v1.0.10\"|" "$SERVER_VALUES"

          sed -i "s|execd_image = \".*opensandbox/execd:.*\"|execd_image = \"${GHCR_REPO}/execd:v1.0.21\"|" "$SERVER_VALUES"
          sed -i "s|image = \".*opensandbox/egress:.*\"|image = \"${GHCR_REPO}/egress:v1.1.5\"|" "$SERVER_VALUES"

      - name: Update chart dependencies
        run: helm dependency update kubernetes/charts/opensandbox

      - name: Lint chart
        run: helm lint kubernetes/charts/opensandbox

      - name: Package chart
        run: helm package kubernetes/charts/opensandbox

      - name: Publish chart to Helm repo (GitHub Pages)
        run: |
          CHART_VERSION=$(grep '^version:' kubernetes/charts/opensandbox/Chart.yaml | awk '{print $2}')
          mkdir -p docs/public/helm
          cp opensandbox-*.tgz docs/public/helm/
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/helm"
          if [ -f docs/public/helm/index.yaml ]; then
            helm repo index docs/public/helm --url "$PAGES_URL" --merge docs/public/helm/index.yaml
          else
            helm repo index docs/public/helm --url "$PAGES_URL"
          fi
          echo "chart_version=${CHART_VERSION}" >> $GITHUB_ENV

      - name: Commit and push updated Helm index
        run: |
          git add -f docs/public/helm/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(helm): publish opensandbox chart v${{ env.chart_version }}"
            git push origin HEAD:main
          fi

      - name: Trigger GitHub Pages deployment
        run: gh workflow run deploy-docs-pages.yml --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
